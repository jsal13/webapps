<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explore random diatonic chord tones across a four-string bass fretboard.">
  <title>Bass Chord Tone Trainer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/bass-chord-tone-trainer.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="wordmark" href="../index.html" aria-label="Webapps home">WEBAPPS</a>
    </header>

    <section class="intro">
      <div class="intro-copy">
        <p class="eyebrow">BASS CHORD TONE TRAINER <span>01</span></p>
        <p class="lede">Pick a key and chord family, then find its tones across a standard four-string bass neck.</p>
      </div>
    </section>

    <section class="map-heading" aria-label="Current chord">
      <div class="summary-item"><span class="summary-label">SELECTED CHORD</span><strong id="chordName">C</strong></div>
      <div class="summary-item"><span class="summary-label">KEY</span><strong id="keyName">C</strong></div>
      <div class="summary-item notes-summary"><span class="summary-label">NOTES</span><strong id="chordNotes">C · E · G</strong></div>
      <div class="summary-item degrees-summary"><span class="summary-label">DEGREES</span><strong id="chordDegrees">1 · 3 · 5</strong></div>
    </section>

    <section class="fretboard-panel" aria-label="Current chord on the bass fretboard">
      <div class="panel-heading">
        <p class="eyebrow">CHORD TONES</p>
        <p class="panel-note" id="fretRangeLabel">Open position through fret 12</p>
      </div>
      <div class="fretboard-scroll">
        <svg id="fretboard" role="img" aria-label="Chord tones on a four-string bass fretboard"></svg>
      </div>
      <div class="legend" id="legend" aria-label="Scale degree legend"></div>
    </section>

    <section class="controls" aria-label="Chord controls">
      <div class="control-group">
        <label for="keySelect">KEY</label>
        <select id="keySelect">
          <option value="any">Any key</option>
          <option value="0" selected>C</option><option value="1">C#</option><option value="2">D</option><option value="3">D#</option>
          <option value="4">E</option><option value="5">F</option><option value="6">F#</option><option value="7">G</option>
          <option value="8">G#</option><option value="9">A</option><option value="10">A#</option><option value="11">B</option>
        </select>
      </div>
      <div class="control-group">
        <div class="label-with-help">
          <label for="difficultySelect">DIFFICULTY</label>
          <span class="help-tip" tabindex="0" role="img" aria-label="Difficulty descriptions" data-tooltip="Easy: diatonic triads. Medium: 7ths and add9 chords. Hard: extended chords and parallel keys.">?</span>
        </div>
        <select id="difficultySelect">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
        </select>
      </div>
      <div class="control-group">
        <label for="fretRangeSelect">FRET RANGE</label>
        <select id="fretRangeSelect">
          <option value="12" selected>Through 12th fret</option>
          <option value="20">Full neck / 20 frets</option>
        </select>
      </div>
      <button class="button button-primary" id="randomizeButton" type="button"><span class="button-icon">↻</span> Random chord</button>
      <div class="chord-entry">
        <label for="chordInput">OR PLOT A CHORD</label>
        <div class="chord-entry-row">
          <input id="chordInput" type="text" placeholder="e.g. Cmaj7" autocomplete="off">
          <button class="button button-secondary" id="plotChordButton" type="button">Plot chord</button>
        </div>
        <p class="input-message" id="inputMessage" role="status" aria-live="polite"></p>
      </div>
    </section>

    <footer class="footer"><span>TUNING <b>G D A E</b></span><span>FRETS <b id="fretCount">0-12</b></span><span>TONES <b id="noteCount">--</b></span></footer>
  </main>
  <script src="js/bass-chord-tone-trainer.js"></script>
</body>
</html>
