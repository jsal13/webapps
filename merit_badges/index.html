<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hobby Merit Badge Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="header">
        <h1>Level Up: Merit Badges</h1>
        <p>A structured roadmap for mastering 20 different hobbies from scratch.</p>
    </div>

    <div class="search-container">
        <input type="text" id="searchBar" placeholder="Search for a hobby..." onkeyup="filterBadges()">
    </div>

    <div class="badge-grid" id="badgeContainer">
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>

</body>
</html>
