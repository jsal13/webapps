<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hobby Merit Badge Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/merit_badges.css">
</head>
<body>
    <header>
        <nav>
            <a href="../index.html" class="logo">Merit Badge Tracker</a>
        </nav>
    </header>

    <main>
        <div class="app-container">
            <div class="intro">
                <h1>Level Up: Merit Badges</h1>
                <p>A structured roadmap for mastering 20 different hobbies from scratch.</p>
            </div>

            <div class="controls">
                <div class="control-group">
                    <label for="searchBar">Search hobbies</label>
                    <input type="text" id="searchBar" placeholder="Search for a hobby..." onkeyup="filterBadges()">
                </div>
            </div>

            <div class="badge-grid" id="badgeContainer">
            </div>
        </div>
    </main>

    <script src="./data/merit_badge_data.js"></script>
    <script src="./js/merit_badges.js"></script>

</body>
</html>
